<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne façon carnet — la liste à acheter en haut, le stock (jauges de consommation) dessous */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --ink:#1C261F; --muted:#5E6B60; --line:#DCE2D6;
  --accent:#2F6B3A; --accent-ink:#FFFFFF; --accent-soft:#E2EEDF;
  --warn:#B86E00; --warn-soft:#FBEED7; --bad:#B3261E; --bad-soft:#F8E1DE; --ok:#3E7F48;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1A211C; --ink:#E6ECE4; --muted:#9AA79C; --line:#2C362E;
  --accent:#7FC489; --accent-ink:#0F1A12; --accent-soft:#213325;
  --warn:#E8A645; --warn-soft:#33281A; --bad:#F08A80; --bad-soft:#3A2220; --ok:#7FC489; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1A211C; --ink:#E6ECE4; --muted:#9AA79C; --line:#2C362E;
  --accent:#7FC489; --accent-ink:#0F1A12; --accent-soft:#213325;
  --warn:#E8A645; --warn-soft:#33281A; --bad:#F08A80; --bad-soft:#3A2220; --ok:#7FC489; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:20px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.date{color:var(--muted);font-size:14px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.ghost:hover{color:var(--ink)}
.small{font-size:13px;padding:5px 10px}

/* Liste à acheter */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);background:transparent;padding:0;display:grid;place-items:center}
.check:hover{background:var(--accent-soft)}
.check svg{opacity:0;width:14px;height:14px}
.check:hover svg{opacity:.5}
.iname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.why{font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.man{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.quick{display:flex;gap:8px;padding:12px 14px;border-top:1px dashed var(--line)}
.quick input{flex:1;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* Stock */
.stock{display:flex;flex-direction:column;gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pcat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.left{font-family:var(--mono);font-size:13px;white-space:nowrap}
.gauge{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.gauge i.warn{background:var(--warn)} .gauge i.bad{background:var(--bad)}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.learn{color:var(--accent);font-weight:500}

/* Formulaire */
details.add{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.add summary{cursor:pointer;padding:14px;font-family:var(--display);font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between}
details.add summary::-webkit-details-marker{display:none}
details.add summary::after{content:"+";font-size:22px;line-height:1;color:var(--accent)}
details.add[open] summary::after{content:"–"}
form.f{padding:0 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.f .full{grid-column:1/-1}
.dur{display:flex;gap:6px}.dur input{width:80px}.dur select{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.mode{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex-direction:row!important;align-items:center;gap:8px!important;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink)!important;font-size:14px!important;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modeDur{display:flex}
#calc{grid-column:1/-1;color:var(--accent);font-weight:500}
.suggest{margin-top:-4px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.suggest b{color:var(--accent);font-weight:600}
.cont select{max-width:260px}
.switch{color:var(--accent);padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.switch:hover{color:var(--ink)}
@media (max-width:460px){.sub{grid-template-columns:1fr}}
@media (max-width:460px){form.f{grid-template-columns:1fr}}

.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.settings input{width:64px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:4px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.edit .full{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <div class="date" id="today"></div>
      <h1>Ma liste de courses</h1>
    </div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Chargement…</span></div>
  </header>

  <section>
    <div class="sechead">
      <h2>À acheter</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="count" id="listCount"></span>
        <button class="small" id="copyBtn" type="button">Copier la liste</button>
      </div>
    </div>
    <div class="list">
      <div id="list"></div>
      <form class="quick" id="quickForm">
        <input id="quickName" placeholder="Ajouter un article ponctuel (ex. farine)" aria-label="Article ponctuel">
        <button class="primary" type="submit">Ajouter</button>
      </form>
    </div>
  </section>

  <details class="add" id="addBox">
    <summary>Suivre un nouveau produit</summary>
    <form class="f" id="addForm">
      <label class="full">Produit
        <input id="fName" required placeholder="ex. Papier toilette (paquet de 6)" list="catalogue" autocomplete="off">
      </label>
      <datalist id="catalogue"></datalist>
      <p class="hint full suggest" id="suggest" hidden></p>
      <label>Catégorie
        <select id="fCat">
          <option>Hygiène</option><option>Entretien</option><option>Épicerie</option>
          <option>Boissons</option><option>Frais</option><option>Autre</option>
        </select>
      </label>
      <label>Acheté le
        <input type="date" id="fDate" required>
      </label>
      <label class="full cont">Je l'achète en
        <select id="fCont">
          <option value="paquet">paquet</option><option value="sac">sac</option><option value="bouteille">bouteille</option>
          <option value="flacon">flacon</option><option value="bidon">bidon</option><option value="tube">tube</option>
          <option value="pot">pot</option><option value="boîte">boîte</option><option value="pack">pack</option>
          <option value="lot">lot</option><option value="rouleau">rouleau</option><option value="sachet">sachet</option>
          <option value="filet">filet</option><option value="barquette">barquette</option><option value="plaquette">plaquette</option>
          <option value="unité">unité (à la pièce)</option>
        </select>
      </label>
      <div class="full mode" role="radiogroup" aria-label="Comment je décris ma consommation" hidden>
        <label class="opt"><input type="radio" name="mode" value="rate"> Je dis combien j'en consomme</label>
        <label class="opt"><input type="radio" name="mode" value="dur" checked> Je dis combien de temps ça me dure</label>
      </div>
      <div class="full sub" id="modeRate" hidden>
        <label><span><span class="unCont">Dans un paquet</span> il y a</span>
          <span class="dur">
            <input type="number" id="fQty" min="1" step="any" value="1" aria-label="Quantité">
            <input id="fUnitName" value="unités" aria-label="Unité" style="flex:1;width:auto;min-width:0">
          </span>
        </label>
        <label>J'en consomme
          <span class="dur">
            <input type="number" id="fRate" min="0.1" step="any" value="1" aria-label="Quantité consommée">
            <select id="fPer" aria-label="Par">
              <option value="1">par jour</option><option value="7" selected>par semaine</option><option value="30">par mois</option>
            </select>
          </span>
        </label>
        <p class="hint" id="calc"></p>
      </div>
      <label class="full sub" id="modeDur"><span><span class="UnCont">Un paquet</span> me dure environ</span>
        <span class="dur">
          <input type="number" id="fNum" min="1" value="1" aria-label="Nombre">
          <select id="fUnit" aria-label="Unité">
            <option value="1">jours</option><option value="7">semaines</option><option value="30" selected>mois</option>
          </select>
        </span>
      </label>
      <div class="full"><button type="button" class="ghost small switch" id="switchMode"></button></div>
      <p class="hint full">Le produit revient tout seul sur ta liste quelques jours avant la fin. À chaque rachat, l'appli corrige ta consommation selon le temps réel écoulé.</p>
      <div class="full"><button class="primary" type="submit">Suivre ce produit</button></div>
    </form>
  </details>

  <section>
    <div class="sechead">
      <h2>Mon stock</h2>
      <span class="count" id="stockCount"></span>
    </div>
    <div class="stock" id="stock"></div>
  </section>

  <div class="settings">
    <label for="remind">Mettre sur la liste</label>
    <input type="number" id="remind" min="0" max="30">
    <span>jours avant la fin estimée</span>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var DAY = 86400000;
  var LS_KEY = "panier-malin-v1";
  var state = {products:[], extras:[], remind:3};
  var saveTimer = null, editing = null;

  function $(id){ return document.getElementById(id); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function iso(d){ var z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
  function todayIso(){ return iso(new Date()); }
  function parse(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function diff(a,b){ return Math.round((parse(b)-parse(a))/DAY); }
  function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
  function fmtDate(s){ return parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
  function fmtDur(n){
    if(n>=60 && n%30===0) return (n/30)+" mois";
    if(n>=28 && Math.abs(n/30-Math.round(n/30))<0.1) return "≈ "+Math.round(n/30)+" mois";
    if(n>=14 && n%7===0) return (n/7)+" semaines";
    return n+" jour"+(n>1?"s":"");
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function info(p){
    var t=todayIso(), used=diff(p.last,t), left=p.days-used;
    var pct=Math.max(0,Math.min(100,Math.round(left/p.days*100)));
    var st = left<=0 ? "bad" : (left<=state.remind ? "warn" : "ok");
    var auto = left<=state.remind;
    return {left:left, pct:pct, st:st, onList: p.manual || auto, auto:auto, end:addDays(p.last,p.days)};
  }

  /* ---------- Sauvegarde (Google Sheet via Apps Script) ---------- */
  function cacheLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
  function save(){
    cacheLocal();
    clearTimeout(saveTimer);
    setSync(false,"Enregistrement…");
    saveTimer = setTimeout(function(){
      google.script.run
        .withSuccessHandler(function(){ setSync(true,"Enregistré"); })
        .withFailureHandler(function(err){ setSync(false,"Erreur d'enregistrement"); toast("Pas enregistré : "+(err && err.message ? err.message : "vérifie ta connexion")); })
        .saveState(JSON.stringify(state));
    }, 700);
  }
  function setSync(on,txt){ $("syncDot").className="dot"+(on?" on":""); $("syncTxt").textContent=txt; }
  function load(json){
    try{ var s=JSON.parse(json); if(s && Array.isArray(s.products)){ state.products=s.products; state.extras=s.extras||[]; state.remind = typeof s.remind==="number"?s.remind:3; } }catch(e){}
  }

  /* ---------- Actions ---------- */
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},2600); }
  function find(id){ for(var i=0;i<state.products.length;i++) if(state.products[i].id===id) return state.products[i]; return null; }

  function bought(p){
    var t=todayIso();
    var real = diff(p.last, p.finished || t);
    var msg = p.name+" : racheté";
    if(real>=1){
      var old=p.days;
      p.days = Math.max(1, Math.round(old*0.5 + real*0.5));
      p.history = (p.history||[]).concat([real]).slice(-6);
      if(p.days!==old) msg += " · durée ajustée à "+fmtDur(p.days);
    }
    p.last=t; p.manual=false; p.finished=null;
    save(); render(); toast(msg);
  }
  function finished(p){ p.finished=todayIso(); p.manual=true; save(); render(); toast(p.name+" ajouté à la liste"); }
  function stillSome(p){ p.days += 7; p.manual=false; save(); render(); toast("OK, "+p.name+" tient une semaine de plus"); }
  function toggleList(p){ p.manual=!p.manual; if(!p.manual) p.finished=null; save(); render(); }

  function rateTxt(p){
    if(p.qty && p.unit){
      var w=p.qty/p.days*7, txt;
      if(w>=7) txt=(Math.round(w/7*10)/10)+" "+p.unit+"/jour";
      else if(w>=0.9) txt=(Math.round(w*10)/10)+" "+p.unit+"/semaine";
      else txt=(Math.round(w*30/7*10)/10)+" "+p.unit+"/mois";
      return "≈ "+txt.replace(".",",")+" · dure "+fmtDur(p.days).replace("≈ ","");
    }
    return "Dure "+fmtDur(p.days);
  }
  /* ---------- Rendu ---------- */
  var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function render(){
    var t=todayIso();
    $("today").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    $("remind").value = state.remind;

    var rows=[];
    state.products.forEach(function(p){ var i=info(p); if(i.onList) rows.push({p:p,i:i}); });
    rows.sort(function(a,b){ return a.i.left-b.i.left; });

    var html="";
    rows.forEach(function(r){
      var p=r.p,i=r.i,chip,why;
      if(p.finished){ chip='<span class="chip bad">Épuisé</span>'; why="Fini le "+fmtDate(p.finished); }
      else if(i.left<0){ chip='<span class="chip bad">Fini</span>'; why="Normalement fini depuis "+(-i.left)+" j"; }
      else if(i.left===0){ chip='<span class="chip bad">Fini</span>'; why="Normalement fini aujourd'hui"; }
      else if(i.auto){ chip='<span class="chip warn">Bientôt</span>'; why="Plus que "+i.left+" j environ"; }
      else { chip='<span class="chip man">Ajouté</span>'; why="Ajouté à la main · "+i.left+" j restants"; }
      html+='<div class="item"><button class="check" type="button" data-buy="'+p.id+'" aria-label="Marquer '+esc(p.name)+' comme acheté">'+CHECK+'</button>'+
        '<div style="min-width:0"><div class="iname">'+esc(p.name)+'</div><div class="why">'+why+'</div></div>'+chip+'</div>';
    });
    state.extras.forEach(function(x){
      html+='<div class="item"><button class="check" type="button" data-xbuy="'+x.id+'" aria-label="Marquer '+esc(x.name)+' comme acheté">'+CHECK+'</button>'+
        '<div style="min-width:0"><div class="iname">'+esc(x.name)+'</div><div class="why">Article ponctuel</div></div><span></span></div>';
    });
    var n=rows.length+state.extras.length;
    if(!n) html='<div class="empty">Rien à acheter pour l\'instant. Les produits suivis apparaîtront ici tout seuls quand ils arriveront à la fin.</div>';
    $("list").innerHTML=html;
    $("listCount").textContent = n ? n+" article"+(n>1?"s":"") : "";
    $("copyBtn").hidden = !n;

    var prods=state.products.slice().sort(function(a,b){ return info(a).left-info(b).left; });
    var sh="";
    prods.forEach(function(p){
      var i=info(p);
      if(editing===p.id){
        sh+='<div class="prod"><div class="pname">Modifier</div><div class="edit">'+
          '<label class="full">Produit<input id="eName" value="'+esc(p.name)+'"></label>'+
          '<label>Acheté le<input type="date" id="eDate" value="'+p.last+'"></label>'+
          '<label>Durée (jours)<input type="number" id="eDays" min="1" value="'+p.days+'"></label>'+
          '</div><div class="acts"><button class="primary small" data-esave="'+p.id+'">Enregistrer</button>'+
          '<button class="small" data-ecancel="1">Annuler</button>'+'<button class="ghost small" data-del="'+p.id+'" style="margin-left:auto;color:var(--bad)">Supprimer</button></div></div>';
        return;
      }
      var leftTxt = i.left>0 ? i.left+" j restants" : (i.left===0?"fini aujourd'hui":"fini");
      var learn = (p.history && p.history.length) ? '<span class="learn">Appris sur '+p.history.length+' achat'+(p.history.length>1?"s":"")+'</span>' : '<span>Estimation de départ</span>';
      sh+='<div class="prod">'+
        '<div class="prow"><div style="min-width:0"><div class="pcat">'+esc(p.cat)+'</div><div class="pname">'+esc(p.name)+'</div></div>'+
        '<div class="left" style="color:var(--'+(i.st==="ok"?"muted":i.st)+')">'+leftTxt+'</div></div>'+
        '<div class="gauge" role="img" aria-label="Stock estimé '+i.pct+' %"><i class="'+i.st+'" style="width:'+Math.max(i.pct,2)+'%"></i></div>'+
        '<div class="meta"><span>Acheté le '+fmtDate(p.last)+'</span><span>'+rateTxt(p)+'</span><span>Fin prévue '+fmtDate(i.end)+'</span>'+learn+'</div>'+
        '<div class="acts">'+
          (i.onList ? '<button class="small primary" data-buy="'+p.id+'">Racheté</button>' : '<button class="small" data-fin="'+p.id+'">Il n\'y en a plus</button>')+
          (i.auto && !p.finished ? '<button class="small" data-more="'+p.id+'">Il m\'en reste</button>' : '')+
          (!i.auto ? '<button class="small" data-tog="'+p.id+'">'+(p.manual?"Retirer de la liste":"Mettre sur la liste")+'</button>' : '')+
          '<button class="ghost small" data-edit="'+p.id+'">Modifier</button>'+
        '</div></div>';
    });
    if(!prods.length){

    else if(d.xbuy){ state.extras=state.extras.filter(function(x){return x.id!==d.xbuy;}); save(); render(); }
    else if(d.fin && (p=find(d.fin))) finished(p);
    else if(d.more && (p=find(d.more))) stillSome(p);
    else if(d.tog && (p=find(d.tog))) toggleList(p);
    else if(d.edit){ editing=d.edit; render(); }

  var MOTS_VIDES = {le:1,la:1,les:1,de:1,du:1,des:1,un:1,une:1,en:1,a:1,au:1,aux:1,et:1,paquet:1,pack:1,lot:1,sac:1,boite:1,bouteille:1};

  function norm(s){
    return String(s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae")
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g," ").trim();
  }
  function premierMot(s){
    var mots=norm(s).split(" ");
    for(var i=0;i<mots.length;i++) if(mots[i].length>1 && !MOTS_VIDES[mots[i]] && !/^\d/.test(mots[i])) return mots[i];
    return "";
  }

  // Quantité écrite dans le nom : « 5 kg », « 1,5 L », « 250 g », « paquet de 12 », « x6 »
  var FACTEUR = {g:1, kg:1000, ml:1, cl:10, l:1000};
  var DIMENSION = {g:"m", kg:"m", ml:"v", cl:"v", l:"v"};
  function quantiteDansNom(nom, e){
    var n=" "+nom.toLowerCase().replace(",",".")+" ";
    var m=n.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l)\b/);
    if(m && e.u){
      var qte=parseFloat(m[1]), uNom=m[2], uCat=e.u.toLowerCase();
      if(FACTEUR[uCat] && DIMENSION[uNom]===DIMENSION[uCat]) return Math.round(qte*FACTEUR[uNom]/FACTEUR[uCat]*1000)/1000;
      return null;
    }
    m=n.match(/(?:paquet|pack|lot|boite|sac)\s+de\s+(\d+)/) || n.match(/\bx\s*(\d+)\b/) || n.match(/\b(\d+)\s*(?:rouleaux|sacs|pastilles|couches|bouteilles|canettes|pots|oeufs|œufs|boites|boîtes|sachets)\b/);
    if(m && e.q) return parseInt(m[1],10);
    return null;
  }

  var PLURIELS = ["","s","x","es"];
  function chercherCatalogue(nom){
    var n=" "+norm(nom)+" ", meilleur=null, longueur=0;
    CATALOGUE.forEach(function(e){
      e.k.forEach(function(k){
        var kk=norm(k);
        // mot entier, au singulier ou au pluriel (« pate » trouve « pâtes », pas « pâté »… ni « maison » pour « mais »)
        if(kk.length<=longueur) return;
        for(var s=0;s<PLURIELS.length;s++){
          if(n.indexOf(" "+kk+PLURIELS[s]+" ")!==-1){ meilleur=e; longueur=kk.length; return; }
        }
      });
    });
    return meilleur;
  }
  // Un produit que tu suis déjà et qui est le même produit : on reprend ce que l'appli a appris
  // (même entrée du catalogue, ou même premier mot pour les produits hors catalogue)
  function chercherDejaSuivi(nom, e){
    var pm=premierMot(nom); if(pm.length<2) return null;
    for(var i=0;i<state.products.length;i++){
      var p=state.products[i];
      if(e ? chercherCatalogue(p.name)===e : (!chercherCatalogue(p.name) && premierMot(p.name)===pm)) return p;
    }
    return null;
  }

  // Valeurs de départ du formulaire, remises quand le produit n'est pas reconnu
  var DEFAUTS = {fCont:"paquet", fCat:"Autre", fQty:"1", fUnitName:"unités", fRate:"1", fPer:"7", fNum:"1", fUnit:"30"};
  // Champs que tu as modifiés toi-même : l'appli ne les écrase plus
  var touche = {};
  ["fCont","fCat","fQty","fUnitName","fRate","fPer","fNum","fUnit"].forEach(function(id){
    $(id).addEventListener("input",function(e){ if(e.isTrusted) touche[id]=true; });
    $(id).addEventListener("change",function(e){ if(e.isTrusted) touche[id]=true; });
  });
  document.querySelectorAll('input[name="mode"]').forEach(function(r){
    r.addEventListener("change",function(e){ if(e.isTrusted) touche.mode=true; });
  });
  function remplir(id, valeur){ if(!touche[id] && valeur!==undefined && valeur!==null) $(id).value=valeur; }
  function choisirMode(m){ if(!touche.mode){ var r=document.querySelector('input[name="mode"][value="'+m+'"]'); if(r) r.checked=true; } }
  function dureeEnUnites(jours){
    if(jours>=60 && jours%30===0) return {n:jours/30, u:"30"};
    if(jours>=14 && jours%7===0) return {n:jours/7, u:"7"};
    return {n:jours, u:"1"};
  }
  function remplirDuree(jours){ var x=dureeEnUnites(jours); remplir("fNum",x.n); remplir("fUnit",x.u); }

  function suggerer(){
    var nom=$("fName").value, box=$("suggest");
    if(norm(nom).length<2){ box.hidden=true; return; }

    var e=chercherCatalogue(nom);
    var deja=chercherDejaSuivi(nom, e);
    if(deja){
      remplir("fCat",deja.cat);
      var eDeja=chercherCatalogue(deja.name); remplir("fCont",(eDeja&&eDeja.ct)||"paquet");
      if(deja.qty && deja.unit){
        choisirMode("rate");
        remplir("fQty",deja.qty); remplir("fUnitName",deja.unit);
        var parSemaine=Math.round(deja.qty/deja.days*7*100)/100;
        remplir("fRate",parSemaine); remplir("fPer","7");
      } else {
        choisirMode("dur");
      }
      remplirDuree(deja.days);
      box.innerHTML='Repris de <b>'+esc(deja.name)+'</b> que tu suis déjà : '+esc(deja.cat)+' · '+fmtDur(deja.days).replace("≈ ","")+' '+parContenant()+
        (deja.history && deja.history.length ? ' (appris sur tes achats)' : '')+'. Tu peux corriger.';
      box.hidden=false; updateCalc(); return;
    }

    if(!e){
      Object.keys(DEFAUTS).forEach(function(id){ remplir(id, DEFAUTS[id]); });
      choisirMode("dur");
      box.textContent="Pas de suggestion pour ce produit : indique combien de temps un paquet te dure.";
      box.hidden=false; updateCalc(); return;
    }

    remplir("fCat",e.c); remplir("fCont",e.ct||"paquet");
    var jours;
    if(e.d){
      choisirMode("dur"); remplirDuree(e.d); jours=e.d;
    } else {
      choisirMode("rate");
      var q=quantiteDansNom(nom,e) || e.q;
      remplir("fQty",q); remplir("fUnitName",e.u); remplir("fRate",e.r); remplir("fPer",String(e.per));
      jours=Math.max(1,Math.round(q/(e.r/e.per)));
      remplirDuree(jours);
    }
    box.innerHTML='Suggestion pour <b>'+esc(e.n)+'</b> : '+esc(e.c)+' · environ '+fmtDur(jours).replace("≈ ","")+' '+parContenant()+'. Tu peux corriger.';
    box.hidden=false; updateCalc();
  }
  var suggTimer=null;
  $("fName").addEventListener("input",function(){ clearTimeout(suggTimer); suggTimer=setTimeout(suggerer,250); });
  $("fName").addEventListener("change",suggerer);
  (function(){
    var html="";
    CATALOGUE.forEach(function(e){ html+='<option value="'+esc(e.n)+'"></option>'; });
    $("catalogue").innerHTML=html;
  })();
  function viderSuggestion(){ touche={}; $("suggest").hidden=true; choisirMode("dur"); updateCalc(); }

  // Lien pour passer d'une façon de décrire à l'autre
  $("switchMode").addEventListener("click",function(){
    var cible = mode()==="rate" ? "dur" : "rate";
    document.querySelector('input[name="mode"][value="'+cible+'"]').checked=true;
    touche.mode=true; updateCalc();
  });

  /* ---------- Démarrage ---------- */
  $("fDate").value=todayIso();
  updateCalc();
  try{ var c=localStorage.getItem(LS_KEY); if(c) load(c); }catch(e){}
  render();
  setSync(false,"Chargement…");
  setInterval(render, 60*60*1000);

  google.script.run
    .withSuccessHandler(function(json){
      if(json){ load(json); cacheLocal(); }
      render(); setSync(true,"Synchronisé avec le Google Sheet");
    })
    .withFailureHandler(function(){ setSync(false,"Hors ligne · copie locale"); })
